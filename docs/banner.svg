  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a0c"/>
      <stop offset="1" stop-color="#171315"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
