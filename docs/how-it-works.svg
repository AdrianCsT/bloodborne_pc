<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="272" viewBox="0 0 1056 272" role="img" aria-labelledby="bb-flow-title bb-flow-desc">
  <title id="bb-flow-title">How Bloodborne PC runs the game</title>
  <desc id="bb-flow-desc">Flow from your own Bloodborne copy through the launcher, a prepared game image and the loader, which feeds the PS4 runtime and the Vulkan renderer, and both run Bloodborne on your CPU.</desc>
  <defs>
    <marker id="bb-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a3acbd"/></marker>
    <marker id="bb-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4414d"/></marker>
  </defs>
  <rect width="1056" height="272" rx="12" fill="#0b0c11"/>
  <g fill="none" stroke="#a3acbd" stroke-width="1.5" marker-end="url(#bb-flow-arrow)">
    <path d="M168 136H200"/>
    <path d="M328 136H360"/>
    <path d="M488 136H520"/>
    <path d="M648 124H668a8 8 0 0 0 8-8V88a8 8 0 0 1 8-8H704"/>
    <path d="M648 148H668a8 8 0 0 1 8 8V184a8 8 0 0 0 8 8H704"/>
  </g>
  <g fill="none" stroke="#d4414d" stroke-width="1.5" marker-end="url(#bb-flow-arrow-accent)">
    <path d="M832 80H852a8 8 0 0 1 8 8V116a8 8 0 0 0 8 8H888"/>
    <path d="M832 192H852a8 8 0 0 0 8-8V156a8 8 0 0 1 8-8H888"/>
  </g>

  <rect x="40" y="96" width="128" height="80" rx="6" fill="#0b0c11"/><rect x="40" y="96" width="128" height="80" rx="6" fill="#a3acbd" fill-opacity="0.10" stroke="#6d7689" stroke-width="1"/>
  <rect x="48" y="104" width="48" height="14" rx="2" fill="none" stroke="#6d7689" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="72" y="114" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="0.8" text-anchor="middle">INPUT</text>
  <text x="104" y="140" fill="#e9e0cd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Your copy</text>
  <text x="104" y="155" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">game folder</text>
  <text x="104" y="168" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">or .pkg files</text>
  <rect x="200" y="96" width="128" height="80" rx="6" fill="#161c29" stroke="#e9e0cd" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="208" y="104" width="48" height="14" rx="2" fill="none" stroke="#a3acbd" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="232" y="114" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="0.8" text-anchor="middle">STEP 1</text>
  <text x="264" y="140" fill="#e9e0cd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Launcher</text>
  <text x="264" y="155" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">settings, patches</text>
  <text x="264" y="168" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">and mods</text>
  <rect x="360" y="96" width="128" height="80" rx="6" fill="#161c29" stroke="#e9e0cd" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="368" y="104" width="48" height="14" rx="2" fill="none" stroke="#a3acbd" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="392" y="114" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="0.8" text-anchor="middle">STEP 1</text>
  <text x="424" y="140" fill="#e9e0cd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Game image</text>
  <text x="424" y="155" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">the game's own</text>
  <text x="424" y="168" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">eboot, relinked</text>
  <rect x="520" y="96" width="128" height="80" rx="6" fill="#161c29" stroke="#e9e0cd" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="528" y="104" width="48" height="14" rx="2" fill="none" stroke="#a3acbd" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="552" y="114" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="0.8" text-anchor="middle">STEP 2</text>
  <text x="584" y="140" fill="#e9e0cd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Loader</text>
  <text x="584" y="155" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">maps the image,</text>
  <text x="584" y="168" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">starts the game</text>
  <rect x="704" y="40" width="128" height="80" rx="6" fill="#161c29" stroke="#e9e0cd" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="712" y="48" width="48" height="14" rx="2" fill="none" stroke="#a3acbd" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="736" y="58" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="0.8" text-anchor="middle">STEP 3</text>
  <text x="768" y="84" fill="#e9e0cd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Runtime</text>
  <text x="768" y="99" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">PS4 libraries,</text>
  <text x="768" y="112" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">reimplemented</text>
  <rect x="704" y="152" width="128" height="80" rx="6" fill="#161c29" stroke="#e9e0cd" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="712" y="160" width="48" height="14" rx="2" fill="none" stroke="#a3acbd" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="736" y="170" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="0.8" text-anchor="middle">STEP 4</text>
  <text x="768" y="196" fill="#e9e0cd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Vulkan renderer</text>
  <text x="768" y="211" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">from shadPS4's</text>
  <text x="768" y="224" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">video core</text>
  <rect x="888" y="96" width="128" height="80" rx="6" fill="#0b0c11"/><rect x="888" y="96" width="128" height="80" rx="6" fill="#d4414d" fill-opacity="0.16" stroke="#d4414d" stroke-width="1.5"/>
  <rect x="896" y="104" width="48" height="14" rx="2" fill="none" stroke="#d4414d" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="920" y="114" fill="#d4414d" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="0.8" text-anchor="middle">RESULT</text>
  <text x="952" y="140" fill="#e9e0cd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Bloodborne</text>
  <text x="952" y="155" fill="#a3acbd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">runs on your CPU</text>
</svg>
